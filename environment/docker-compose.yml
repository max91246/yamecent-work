services:
  nginx:
    image: nginx:1.25-alpine
    container_name: yamecent-nginx
    restart: unless-stopped
    depends_on:
      - php-fpm
      - vite
    volumes:
      - ../../yamecent-admin:/var/www/admin
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/sites-available:/etc/nginx/sites-available:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network

  php-fpm:
    build:
      context: ../../yamecent-admin/docker/php-fpm
      dockerfile: Dockerfile
    container_name: yamecent-php-fpm
    restart: unless-stopped
    volumes:
      - ../../yamecent-admin:/var/www
      - ../../yamecent-admin/docker/php-fpm/php.ini:/usr/local/etc/php/php.ini:ro
    networks:
      - app-network

  mysql:
    image: mysql:8.4
    container_name: yamecent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yamecent
    networks:
      - app-network

  redis:
    image: redis:8-alpine
    container_name: yamecent-redis
    restart: unless-stopped
    command: redis-server --requirepass secret_redis
    volumes:
      - redis-data:/data
    networks:
      - app-network

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: yamecent-flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    networks:
      - app-network

  vite:
    image: node:20-alpine
    container_name: yamecent-vite
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm dev"
    volumes:
      - ../../yamecent-vue:/app
      - vue-node-modules:/app/node_modules
    networks:
      - app-network

networks:
  app-network:
    name: yamecent-network
    driver: bridge

volumes:
  redis-data:
  vue-node-modules:
